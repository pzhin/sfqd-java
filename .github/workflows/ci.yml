name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Prove undocumented public API fails the build
        run: tools/verify-javadoc-gate.sh

  jcstress-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run all jcstress tests in quick mode
        run: ./mvnw --batch-mode --no-transfer-progress -Pjcstress clean verify

  reproducible-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify reproducible Maven artifacts
        env:
          MAVEN_ARGS: ""
        run: tools/verify-reproducible-build.sh

  publication-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify deploy topology and fresh consumer resolution
        env:
          MAVEN_ARGS: ""
        run: tools/verify-publication-topology.sh

  benchmark-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package and analyze benchmark harness
        run: ./mvnw --batch-mode --no-transfer-progress -Pbenchmarks -DskipTests clean verify

      - name: List generated benchmarks
        run: java -jar sfqd-benchmarks/target/sfqd-benchmarks.jar -l

      - name: Run one short harness iteration
        run: >-
          java -jar sfqd-benchmarks/target/sfqd-benchmarks.jar
          '^io\.github\.pzhin\.sfqd\.benchmarks\.OperationLatencyBenchmark\.enqueueBackloggedTail$'
          -p flowCount=1 -p depth=1 -p scenario=UNIFORM
          -wi 0 -i 1 -f 1 -r 100ms
